# Builds the site and publishes it on GitHub Pages every time I push to main, and once a day.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every day at 08:00 India time, so new blog posts show up on their own.
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Change this if the site moves to its own domain.
          SITE_URL: ${{ vars.SITE_URL || 'https://kodeshaastra.github.io' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
